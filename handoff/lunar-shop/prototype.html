 return plant.seconds*(100-15*(upgradeLevels.watering||0))/100;
}
const gardenAutomation={replant:true,harvest:true};
function startPlanting(bed,plant,now=Date.now()){
 bed.duration=plantGrowthSeconds(plant)*1000;
 bed.plant=plant.id;bed.state='growing';bed.end=now+bed.duration;
}
function harvestBed(bed,now=Date.now(),replant=false){
 if(bed.state!=='ready')return;
 const plant=plants.find(item=>item.id===bed.plant);
 if(!plant)return;
 const boost=afterFair.boost;
 const doubled=boost&&beds[boost.bed]===bed;
 changeIngredient(plant.id,(3+(upgradeLevels.soil||0))*(doubled?2:1));
 if(doubled&&--boost.remaining===0){
  afterFair.boost=null;
  afterFair.practiced.add('orchard');
 }
 if(replant||(upgradeLevels.planter&&gardenAutomation.replant))startPlanting(bed,plant,now);
 else bed.state='empty';
}

function fairPotionNames(ids){

function fairObjective(){
 if(fairProject.delivered===2)return afterFairObjective();
 const route=fairRoutes[fairProject.route];
 if(!route)return {title:'Выберите маршрут',steps:[]};
 const ids=route.deliveries[fairProject.delivered];
 const required=Math.max(...ids.map(id=>potionData[id].orders));
 const steps=[];
 if(orderProgress()<required)steps.push(differentPotionsStep(required));
 steps.push(['Сдать набор '+fairPotionNames(ids),false]);
 return {title:route.title+(fairProject.delivered?' · финал':' · первая поставка'),steps};
}

function syncFairOrder(){
 if(fairProject.delivered===2){syncAfterFairOrder();return}
 const route=fairRoutes[fairProject.route];
 const stage=fairProject.delivered;
 const ids=route?.deliveries[stage];
 if(!ids||orderProgress()<20||ids.some(id=>potionData[id].orders>orderProgress())){
  if(orders[1]?.goal)orders[1]=nextOrder(1);
  return;
 }
 if(orders[1]?.fairRoute===fairProject.route&&orders[1].fairStage===stage)return;
 orders[1]={
  id:ids[0],quantity:1,type:'mixed',customer:'Торговец Савва',goal:'fair',
  fairRoute:fairProject.route,fairStage:stage,
  items:ids.map(id=>({id,quantity:1}))
 };
}

let legacyProgress=completedOrders===30?30:0;

function differentPotionCount(){

function nextReputationUnlock(){
 const points=reputation(),progress=orderProgress();
 const potions=Object.values(potionData);

 if(!Number.isFinite(threshold))return {points,threshold:null,remaining:0,goal:null,recipes:[]};
 const goal=progressionGoals.find(item=>item.orders<=threshold&&!goalMet(item));
 const recipes=potions.filter(potion=>potion.orders===threshold).map(potion=>potion.name);

}

 return pending?Math.min(reputation(),pending.orders-1):reputation();
}
function differentPotionsStep(required){

}

function paintPanelFrame(target){

  const dw=targetX[col+1]-targetX[col],dh=targetY[row+1]-targetY[row];
  if(sw&&sh&&dw&&dh)ctx.drawImage(image,sourceX[col],sourceY[row],sw,sh,targetX[col],targetY[row],dw,dh);

function ingredientCost(item,quantity){
 const cost=item.price*quantity;
 return upgradeLevels.bulk&&quantity>=3?Math.ceil(cost*9/10):cost;
}
function buyIngredient(item,quantity){
 const cost=ingredientCost(item,quantity);
 if(!Number.isSafeInteger(quantity)||quantity<1||orderProgress()<item.orders||cost>coins)return false;
 coins-=cost;changeIngredient(item.id,quantity);return true;
}
function supplierOptions(){
 const {pane,close}=framedAutomationDialog('Постоянный поставщик','supplier-dialog');
 const enabled=automationSwitch(pane,'Автозакупка включена',supplier.enabled);
 const budget=optionField(pane,'Бюджет на закупки','number',supplier.budget);
 const note=document.createElement('p');note.className='supplier-note';note.textContent='Остаток бюджета: '+supplierBudgetLeft()+'. Ноль в строке товара — не закупать.';pane.append(note);
 const targets=shopItems.map(item=>[item.id,optionField(pane,item.name+' · целевой запас','number',supplier.targets[item.id]||0)]);
 const integer=input=>Math.max(0,Math.min(99999,Math.floor(Number(input.value)||0)));
 function save(resetBudget){
  const limit=integer(budget);
  supplier={enabled:enabled.checked,budget:limit,spent:resetBudget?0:supplier.spent,targets:Object.fromEntries(targets.map(([id,input])=>[id,Math.min(999,integer(input))]))};
  close();
 }
 const actions=document.createElement('div');actions.className='supplier-actions';pane.append(actions);
 framedConfirmAction(actions,'Сохранить',()=>save(false));
 framedConfirmAction(actions,'Обновить бюджет',()=>save(true)).classList.add('supplier-reset');
 dialogAction(actions,'Отмена',close).className='queue-action';
}
function runSupplier(){
 if(!upgradeLevels.supplier||!supplier.enabled)return false;
 let changed=false;
 for(const item of shopItems){
  const missing=(supplier.targets[item.id]||0)-ingredientCount(item.id);
  const budget=Math.min(coins,supplierBudgetLeft());
  let amount=Math.min(missing,Math.floor(budget*10/(item.price*9)));
  while(amount>0&&ingredientCost(item,amount)>budget)amount--;
  if(amount>0&&buyIngredient(item,amount)){supplier.spent+=ingredientCost(item,amount);changed=true}
 }
 return changed;
}

function brewCapacity(){return 1+(upgradeLevels.capacity||0)}

function brewCosts(recipe,quantity){return Object.entries(recipeCosts[recipe]).map(([id,amount])=>[id,amount*quantity])}
function startBrew(batch,now=Date.now()){
 brewingRecipe=batch.recipe;activeBrewQuantity=batch.quantity;
 brewDuration=brewSeconds[batch.recipe]*10*(100-15*(upgradeLevels.speed||0));
 boiling=true;brewEnd=now+brewDuration;
}
function scheduleBrew(recipe,quantity){
 const pending=boiling||brewQueue.length>0;
 if(!potionRecipeOpen(recipe)||!Number.isInteger(quantity)||quantity<1||quantity>brewCapacity())return false;
 if((pending&&brewQueue.length>=brewQueueLimit())||(!upgradeLevels.queue&&brewReady))return false;
 const costs=brewCosts(recipe,quantity);
 if(costs.some(([id,amount])=>ingredientCount(id)<amount))return false;
 costs.forEach(([id,amount])=>changeIngredient(id,-amount));
 const batch={recipe,quantity,costs};
 if(pending)brewQueue.push(batch);else startBrew(batch);
 return true;
}

function nextOrder(index,excludedIds=[],recentIds=[]){
 const order={id:'tea',quantity:1,customer:orderCustomers[index]};

 const available=pool.filter(id=>!listed.has(id));

 const preferred=untried.length?untried:choices;
 const fresh=preferred.filter(id=>!recentIds.includes(id));
 order.id=pickOrderOption(fresh.length?fresh:preferred);
 if(index<=1||progress<8)return order;

 if(pool.length>=2)variants.push('mixed');

 if(variant==='normal'&&capacity>1&&completedPotionOrders.has(order.id)&&Math.random()<0.25)order.quantity=2;
 if(variant==='large'){
  const maximum=Math.min(5,capacity+1+Number(progress>=20));
  order.type='large';
  order.quantity=3+Math.floor(Math.random()*(maximum-2));
 }
 if(variant==='mixed'){
  const additional=pool.filter(id=>id!==order.id);
  const count=progress>=20&&additional.length>=2?pickOrderOption([1,2]):1;
  order.type='mixed';
  order.items=[{id:order.id,quantity:1}];

function advanceProduction(now){
 let changed=false;
 for(const bed of beds){
  if(bed.state==='growing'&&now>=bed.end){bed.state='ready';changed=true}
  if(bed.state==='ready'&&upgradeLevels.gardener&&gardenAutomation.harvest){harvestBed(bed,now);changed=true}
 }
 if(boiling&&now>=brewEnd){
  finishedBrews.push({recipe:brewingRecipe,quantity:activeBrewQuantity});
  boiling=false;brewReady=true;changed=true;
 }
 if(upgradeLevels.brew_collect&&brewReady){collectBrews();changed=true}
 if(!boiling&&brewQueue.length&&brewAutomation){startBrew(brewQueue.shift(),now);changed=true}
 if(grindingEnd&&now>=grindingEnd){
  finishedGrinds.push(activeGrind);
  activeGrind=null;grindingEnd=0;changed=true;
 }
 if(upgradeLevels.grind_collect&&finishedGrinds.length){collectGroundIngredients();changed=true}
 if(!grindingEnd&&grindQueue.length&&grindAutomation){startGrinding(grindQueue.shift(),now);changed=true}
 if(distillBatch&&now>=distillBatch.end){
  distillReady=distillBatch.id;
  distillBatch=null;
  changed=true;
 }
 if(upgradeLevels.distill_collect&&distillReady){collectDistillation();changed=true}
 return changed;
}

const offlineLimit = 2 * 60 * 60 * 1000;
const legacySaveKey = 'lunar-shop:standard:v1';
let lastSave = null;

const slotNumbers=[1,2,3];
const slotDateFormat=new Intl.DateTimeFormat('ru-RU',{dateStyle:'short',timeStyle:'short'});
let activeSlot=null;
let startScreen='actions';

function readSlot(number){
 const key=legacySaveKey+':slot:'+number;
 let raw=null;
 let saved=null;
 try{
  raw=localStorage.getItem(key);
  const payload=raw ?? (number===1 ? localStorage.getItem(legacySaveKey) : null);
  saved=JSON.parse(payload);
 }catch(error){
  // Allow a fresh game when storage is unavailable.
 }
 if(!saved || !Number.isFinite(saved.savedAt))return {number,key,raw,saved:null};
 const arrays=[saved.beds,saved.brewQueue,saved.finishedBrews,saved.grindQueue,saved.finishedGrinds,
  saved.orders,saved.completedPotionOrders,saved.pendingRecipeUnlocks];
 if(!arrays.every(Array.isArray) || saved.beds.length!==beds.length ||
    saved.beds.some(bed=>!bed || (bed.state==='growing' && !Number.isFinite(bed.end)))){
  return {number,key,raw,saved:null};
 }
 return {number,key,raw,saved};
}

function launchSlot(number,newGame=false){
 if(activeSlot)return;
 const slot=readSlot(number);
 if(!newGame && !slot.saved){render();return}
 if(newGame && slot.saved){
  const {pane,close}=framedAutomationDialog('Начать заново в слоте '+number+'?','garden-automation-dialog');
  const warning=document.createElement('p');
  warning.textContent='Сохранение в этом слоте будет заменено.';
  pane.append(warning);
  const cancel=dialogAction(pane,'Отмена',close);
  cancel.className='queue-action';
  cancel.style.display='inline-block';
  cancel.focus();
  const confirm=framedConfirmAction(pane,'Начать заново',()=>{
   if(readSlot(number).raw!==slot.raw){close();return}
   enterSlot(slot,null);
  });
  confirm.style.marginLeft='18px';
  return;
 }
 enterSlot(slot,newGame?null:slot.saved);
}

function enterSlot(slot,saved){
 activeSlot=slot;
 lastSave=slot.raw;
 const now=Date.now();
 let rows=[];
 if(saved){
  restoreGame(saved);
  rows=advanceOffline(saved.savedAt,now);
 }
 page='home';
 saveGame(now);
 render();
 if(rows.length)showReturnSummary(rows);
}

function startMenu(){
 sprite(home+'start_background.png',0,0,1920,1080);
 const menu=document.createElement('nav');
 menu.className='start-menu';
 menu.setAttribute('aria-label','Главное меню');
 const options=document.createElement('div');
 options.className='start-menu-options';
 menu.append(options);view.append(menu);
 const title=document.createElement('h1');
 title.textContent='Лунная лавка';
 options.append(title);
 const action=(label,fn,disabled=false)=>{
  const button=dialogAction(options,label,fn);
  button.type='button';
  button.disabled=disabled;
  return button;
 };
 const open=screen=>{startScreen=screen;render()};
 if(startScreen==='settings'||startScreen==='exit'){
  const message=document.createElement('p');
  message.textContent=startScreen==='settings'?'Настройки пока недоступны.':'Игра завершена. Можно закрыть вкладку.';
  options.append(message);
  action('В главное меню',()=>open('actions'));
  return;
 }

 const slots=slotNumbers.map(readSlot);
 if(startScreen==='actions'){
  const latest=slots.filter(slot=>slot.saved).sort((a,b)=>b.saved.savedAt-a.saved.savedAt)[0];
  if(latest)action('Продолжить',()=>launchSlot(latest.number));
  action('Новая игра',()=>open('new'));
  action('Загрузить',()=>open('load'));
  action('Настройки',()=>open('settings'));
  const exit=action('Выйти',()=>open('exit'));
  exit.className='start-exit';
  menu.append(exit);
  return;
 }

 const heading=document.createElement('h2');
 const newGame=startScreen==='new';
 heading.textContent=newGame?'Новая игра':'Загрузить игру';
 options.append(heading);
 for(const slot of slots){
  const button=action('Слот '+slot.number,()=>launchSlot(slot.number,newGame),!newGame&&!slot.saved);
  button.className='save-slot';
  const detail=document.createElement('span');
  detail.textContent=slot.saved
   ? 'Заказов выполнено: '+slot.saved.completedOrders+' · '+slotDateFormat.format(slot.saved.savedAt)
   : 'Пустой слот';
  button.append(detail);
 }
 action('Назад',()=>open('actions'));
}

function leaveForStartMenu(){
 saveGame();
 location.reload();
}


function saveGame(now = Date.now()){
 if(!activeSlot)return;
 const saveKey=activeSlot.key;
 try {
  // Avoid overwriting a save that changed in another tab.
  if(localStorage.getItem(saveKey)!==lastSave)return;
  const snapshot=JSON.stringify({
   savedAt:now, coins, stock, tea, potionStock, cropStock, purchasedIngredients, groundStock,
   beds, upgradeLevels, completedOrders, legacyProgress, completedPotionOrders:[...completedPotionOrders],
   orders, orderReplacementReadyAt, fairProject, afterFair:{
    ...afterFair,completed:[...afterFair.completed],used:[...afterFair.used],practiced:[...afterFair.practiced]
   }, distillBatch, distillReady, pendingRecipeUnlocks:[...pendingRecipeUnlocks],
   gardenAutomation, brewAutomation, grindAutomation, supplier,
   boiling, brewEnd, brewDuration, brewingRecipe, activeBrewQuantity, brewQueue, finishedBrews,
   grindingEnd, activeGrind, grindQueue, finishedGrinds
  });
  localStorage.setItem(saveKey,snapshot);
  lastSave=snapshot;
 }catch(error){
  // The game remains playable if the browser blocks persistent storage.
 }
}

function restoreGame(saved){
 ({
  coins, stock, tea, potionStock, cropStock, purchasedIngredients, upgradeLevels,
  completedOrders, orders, orderReplacementReadyAt,
  brewAutomation, grindAutomation, supplier, boiling, brewEnd, brewDuration,
  brewingRecipe, activeBrewQuantity, grindingEnd, activeGrind
 }=saved);
 delete upgradeLevels.shopkeeper;
 for(const order of orders)delete order.auto;
 Object.assign(groundStock,saved.groundStock);
 Object.assign(gardenAutomation,saved.gardenAutomation);
 beds.splice(0,beds.length,...saved.beds);
 brewQueue.push(...saved.brewQueue);
 finishedBrews.push(...saved.finishedBrews);
 grindQueue.push(...saved.grindQueue);
 finishedGrinds.push(...saved.finishedGrinds);
 saved.completedPotionOrders.forEach(id=>completedPotionOrders.add(id));
 if(saved.fairProject){
  const route=saved.fairProject.route;
  fairProject.route=Object.hasOwn(fairRoutes,route)?route:null;
  fairProject.delivered=[1,2].includes(saved.fairProject.delivered)?saved.fairProject.delivered:0;
 }else{
  fairProject.delivered=completedPotionOrders.has('healing_draught')?2:0;
 }
 if(Number.isFinite(saved.legacyProgress))legacyProgress=saved.legacyProgress;
 else {
  const previousGate=progressionGoals.find(goal=>goal.orders&&!goalMet(goal));
  legacyProgress=previousGate?Math.min(completedOrders,previousGate.orders-1):completedOrders;
 }
 const event=saved.afterFair?.route;
 afterFair.route=Object.hasOwn(afterFairEvents,event)?event:null;
 afterFair.done=Boolean(afterFair.route&&saved.afterFair?.done);
 for(const key of ['completed','used','practiced']){
  const values=saved.afterFair?.[key];
  if(Array.isArray(values))values.filter(route=>Object.hasOwn(afterFairEvents,route)).forEach(route=>afterFair[key].add(route));
 }
 if(afterFair.done)afterFair.completed.add(afterFair.route);
 if(Array.isArray(saved.afterFair?.offers)){
  afterFair.offers=[...new Set(saved.afterFair.offers.filter(id=>Object.hasOwn(potionData,id)&&id!=='tea'))].slice(0,2);
 }
 const boost=saved.afterFair?.boost;
 if(afterFair.route==='orchard'&&afterFair.done&&Number.isInteger(boost?.bed)&&beds[boost.bed]&&[1,2].includes(boost.remaining)){
  afterFair.boost={bed:boost.bed,remaining:boost.remaining};
 }
 const batch=saved.distillBatch;
 distillBatch=batch&&Object.hasOwn(essenceRecipes,batch.id)&&Number.isFinite(batch.end)?batch:null;
 distillReady=!distillBatch&&Object.hasOwn(essenceRecipes,saved.distillReady)?saved.distillReady:null;
 // Preserve the contents of removed routes and refund obsolete production once.
 const removedRecipes={clear_sight:{sunflower:2,mintleaf:2},steady_grip:{spring_root:2,sunflower:1,rainbow_powder:1}};
 const removed=id=>Object.hasOwn(removedRecipes,id);
 const refund=(id,quantity)=>{
  if(!removed(id)||!Number.isSafeInteger(quantity)||quantity<1)return;
  for(const [ingredient,amount] of Object.entries(removedRecipes[id]))changeIngredient(ingredient,amount*quantity);
 };
 if(Array.isArray(saved.mapTrip?.finds)){
  const validNodes={north:['mintleaf'],meadow:['mintleaf'],south:['coins'],trail:['coins','wind_feather'],spring:['moon_dew'],dock:['wind_feather']},credited=new Set();
  for(const find of saved.mapTrip.finds){
   if(!find||credited.has(find.node)||!validNodes[find.node]?.includes(find.id)||!Number.isSafeInteger(find.amount)||find.amount<1||find.amount>5||!Number.isSafeInteger(find.coins)||find.coins<0||find.coins>8)continue;
   credited.add(find.node);
   if(find.id==='coins')coins+=find.amount;else changeIngredient(find.id,find.amount);
   coins+=find.coins;
  }
 }
 const initialStock=legacySaveKey==='lunar-shop:standard:v1'?0:99;
 for(const id of Object.keys(removedRecipes)){refund(id,Math.max(0,(potionStock[id]||0)-initialStock));delete potionStock[id]}
 if(removed(brewingRecipe)){
  if(boiling)refund(brewingRecipe,activeBrewQuantity);
  boiling=false;brewEnd=0;brewingRecipe='tea';activeBrewQuantity=1;
 }
 for(let i=brewQueue.length-1;i>=0;i--){
  const batch=brewQueue[i];if(!removed(batch.recipe))continue;
  if(Array.isArray(batch.costs)&&batch.costs.length){for(const [id,amount] of batch.costs)if(Number.isSafeInteger(amount)&&amount>0)changeIngredient(id,amount)}
  else refund(batch.recipe,batch.quantity);
  brewQueue.splice(i,1);
 }
 for(let i=finishedBrews.length-1;i>=0;i--){
  if(!removed(finishedBrews[i].recipe))continue;
  refund(finishedBrews[i].recipe,finishedBrews[i].quantity);finishedBrews.splice(i,1);
 }
 const oldReputation=Math.min(completedOrders,2)+3*[...completedPotionOrders].filter(id=>id!=='tea').length;
 if([...completedPotionOrders].some(removed))legacyProgress=Math.max(legacyProgress,oldReputation);

 for(let i=0;i<orders.length;i++)if(removed(orders[i].id)||(orders[i].items||[]).some(item=>removed(item.id)))orders[i]=nextOrder(i);
 saved.pendingRecipeUnlocks.filter(name=>!['Ясный взгляд','Крепкая хватка'].includes(name)).forEach(name=>pendingRecipeUnlocks.add(name));
 brewReady=finishedBrews.length>0;
}

function advanceOffline(savedAt,now){
 if(now<=savedAt)return [];
 const counts = () => ({
  harvest:plants.reduce((sum,plant)=>sum+ingredientCount(plant.id),0),
  brewed:finishedBrews.reduce((sum,batch)=>sum+batch.quantity,0),
  ground:finishedGrinds.reduce((sum,batch)=>sum+batch.quantity,0),
  distilled:Object.keys(essenceRecipes).reduce((sum,id)=>sum+potionCount(id),0),
  distilledReady:Number(Boolean(distillReady)),
  brewedStock:Object.keys(potionData).reduce((sum,id)=>sum+potionCount(id),0),
  groundStock:Object.values(groundStock).reduce((sum,amount)=>sum+amount,0)
 });
 const before=counts();
 const growingBeds=beds.filter(bed=>bed.state==='growing');
 const end=Math.min(now,savedAt+offlineLimit);
 let time=savedAt;
 advanceProduction(time);
 while(true){
  const deadlines=beds.filter(bed=>bed.state==='growing').map(bed=>bed.end);
  if(boiling)deadlines.push(brewEnd);
  if(grindingEnd)deadlines.push(grindingEnd);
  if(distillBatch)deadlines.push(distillBatch.end);
  time=Math.min(...deadlines);
  if(time>end)break;
  advanceProduction(time);
 }

 // Keep the remaining time on jobs that were still running when the limit was reached.
 const paused=now-end;
 for(const bed of beds)if(bed.state==='growing')bed.end+=paused;
 if(boiling)brewEnd+=paused;
 if(grindingEnd)grindingEnd+=paused;
 if(distillBatch)distillBatch.end+=paused;

 const after=counts();
 const ripe=growingBeds.filter(bed=>bed.state==='ready').length;
 const rows=[];
 if(ripe)rows.push('Грядок созрело: '+ripe);
 if(after.harvest>before.harvest)rows.push('Автосбор добавил в инвентарь: '+(after.harvest-before.harvest));
 if(after.brewed>before.brewed)rows.push('Порций в котле готово: '+(after.brewed-before.brewed));
 if(after.ground>before.ground)rows.push('Порций в ступке готово: '+(after.ground-before.ground));
 if(after.distilledReady>before.distilledReady)rows.push('В кубе готова эссенция');
 if(after.brewedStock>before.brewedStock)rows.push('Зелий собрано: '+(after.brewedStock-before.brewedStock));
 if(after.groundStock>before.groundStock)rows.push('Порошков собрано: '+(after.groundStock-before.groundStock));
 if(after.distilled>before.distilled)rows.push('Эссенций в инвентаре: +'+(after.distilled-before.distilled));
 return rows;
}

function showReturnSummary(rows){
 const {pane,close}=framedAutomationDialog('С возвращением!','garden-automation-dialog');
 for(const message of rows){
  const line=document.createElement('p');
  line.textContent=message;
  pane.append(line);
 }
 framedConfirmAction(pane,'Продолжить',close).focus();
}

addEventListener('pagehide',()=>saveGame());
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='hidden')saveGame();
});

let frame=0,lastSecond=0,needsRender=false;
setInterval(()=>{
 if(!activeSlot)return;
 const now=Date.now(), sec=Math.floor(now/1000);
 if(advanceProduction(now)){needsRender=true;refreshOpenQueue?.()}
 if(sec!==lastSecond){
  lastSecond=sec;
  refreshOrderReplacement?.(now);
  if(runSupplier())needsRender=true;
  saveGame(now);
  if((page==='garden'&&beds.some(b=>b.state==='growing'))||(page==='lab'&&(boiling||grindingEnd||distillBatch)))needsRender=true;
 }
 if(needsRender&&!view.querySelector('.cover')){needsRender=false;render()}
 let effect=document.getElementById('boil');
 if(effect){frame=(frame+1)%36;effect.style.backgroundPosition=`${(frame%6)*20}% ${Math.floor(frame/6)*20}%`}
},80);
render();
</script></body></html>
